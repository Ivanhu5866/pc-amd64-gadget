name: pc
version: '20-0.4'
type: gadget
base: core20
summary: PC gadget for generic devices
description: |
    This gadget enables generic pc devices to work with Ubuntu Core
grade: stable
confinement: strict
icon: icon.png

# Min version to support shim 15.7
assumes:
  - snapd2.59.3

parts:
  grub-prepare:
    plugin: nil
    stage-packages:
      - grub-efi-amd64-signed
      - shim-signed
    prime: [ -* ]
  grub:
    source: .
    build-packages:
      - grub-common
      - grub-pc-bin
      - sbsigntool
    plugin: make
    after: [grub-prepare]
  fwts:
    plugin: nil
    override-prime: mkdir fwts
